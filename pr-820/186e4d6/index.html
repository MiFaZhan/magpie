<main><h1>#820 界面预览</h1><p class="m">commit 186e4d6 · <a href="https://github.com/yetone/magpie/pull/820">回到 PR</a> · 这个 diff 给界面加了两类保护：关闭有未保存改动的供应商/路由/资源库编辑器时先弹出应用内的「放弃修改」确认框；删除供应商、账号密钥、路由组、插件及其中间件选项、资源库条目等操作不再立即生效，而是先弹确认框（并统一了 .action-confirm 弹窗样式、对话框语义和焦点圈定）。此外导航项加上 aria-current，并在首屏之前由新的 layout.js/theme.js 应用模式、平台、主题与字号。</p>

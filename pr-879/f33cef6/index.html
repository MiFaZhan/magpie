<main><h1>#879 界面预览</h1><p class="m">commit f33cef6 · <a href="https://github.com/yetone/magpie/pull/879">回到 PR</a> · 供应商页新增了「本机配置发现」提示：打开供应商页时后台扫描 Alma / CC Switch / Claude Code / Codex 的可导入配置，列表为空时在列表上方显示醒目的发现条，已有供应商时在「添加供应商」旁显示紧凑的导入链接，并带「忽略」（指纹记在本地存储）。点该链接会用发现结果预选打开既有的导入面板，导入完成后重新扫描。</p>
